name: Pulizia branch

# Avvio solo a mano (Actions → Pulizia branch → Run workflow).
# Senza la spunta "esegui" mostra soltanto cosa farebbe, nel riepilogo dell'esecuzione.
# Tiene main, monitoraggio, i branch con PR aperta e quelli toccati negli ultimi 2 giorni;
# elimina i branch di PR già unite e quelli vuoti; il lavoro mai unito resta nei tag archivio/*.
on:
  workflow_dispatch:
    inputs:
      esegui:
        description: "Elimina davvero (senza spunta: solo anteprima)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pulizia-branch
  cancel-in-progress: false

jobs:
  pulizia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Pulizia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ESEGUI: ${{ inputs.esegui }}
        run: python .github/scripts/cleanup_branches.py
