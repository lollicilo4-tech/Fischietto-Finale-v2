name: Aggiorna pronostici

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"   # Ogni 4 ore; la cache AI persistente evita rianalisi inutili degli stessi incontri
  workflow_dispatch:          # pulsante "Run workflow" nella scheda Actions

permissions:
  contents: write

concurrency:
  group: aggiorna-pronostici
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Test automatici della validazione AI
        run: python -m unittest discover -s tests -v

      # Ricerca notizie gratuita per quando Groq è fuori quota (app/news.py). Se SearXNG non
      # parte, l'aggiornamento continua lo stesso con Tavily o con il solo modello statistico.
      - name: Avvia SearXNG
        continue-on-error: true
        run: |
          docker run -d --name searxng -p 8080:8080 \
            -e SEARXNG_SECRET="$(openssl rand -hex 32)" \
            -e SEARXNG_BASE_URL=http://localhost:8080/ \
            -v "$PWD/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            searxng/searxng:latest
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:8080/search?q=calcio&format=json" >/dev/null 2>&1; then
              echo "SearXNG pronto"; exit 0
            fi
            sleep 2
          done
          echo "::warning title=SearXNG non disponibile::La ricerca gratuita userà solo Tavily (se configurato)."
          docker logs searxng 2>&1 | tail -20

      - name: Genera il sito
        id: generate
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARXNG_URL: http://localhost:8080
        # Uscita 2 = aggiornamento parziale: si salvano comunque le leghe riuscite
        # e i loro pronostici, poi l'ultimo step segnala l'errore.
        run: |
          set +e
          python generate.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi

      - name: Salva le modifiche
        run: |
          # Conserva l'output generato prima di riallineare il checkout all'ultimo main.
          mkdir -p /tmp/generated-docs
          cp -a docs/. /tmp/generated-docs/
          mkdir -p /tmp/generated-data
          for f in predictions.json ai_cache.json; do
            if [ -f "data/$f" ]; then cp "data/$f" "/tmp/generated-data/$f"; fi
          done

          git fetch origin main
          git reset --hard origin/main

          # Applica soltanto i JSON generati: index.html e gli asset statici
          # sono pubblicati da sync-static.yml e non vanno sovrascritti da un checkout vecchio.
          find /tmp/generated-docs -maxdepth 1 -type f -name '*.json' -exec cp -a {} docs/ \;
          git add docs
          mkdir -p data
          for f in predictions.json ai_cache.json; do
            if [ -f "/tmp/generated-data/$f" ]; then
              cp "/tmp/generated-data/$f" "data/$f"
              git add "data/$f"
            fi
          done
          if git diff --staged --quiet; then
            echo "Nessun dato generato da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna pronostici"
          git push origin main

      - name: Segnala le leghe non aggiornate
        if: steps.generate.outputs.code == '2'
        run: |
          echo "::error title=Aggiornamento parziale::Almeno una lega non è stata aggiornata: vedi i dettagli nello step 'Genera il sito'. Le altre leghe sono state pubblicate."
          exit 1
