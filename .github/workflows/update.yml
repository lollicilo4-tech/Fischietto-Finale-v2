name: Aggiorna pronostici

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"   # Ogni 4 ore; la cache AI persistente evita rianalisi inutili degli stessi incontri
  workflow_dispatch:          # pulsante "Run workflow" nella scheda Actions

permissions:
  contents: write

concurrency:
  group: aggiorna-pronostici
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      - name: Test automatici della validazione AI
        run: python -m unittest discover -s tests -v

      - name: Genera il sito
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: python generate.py

      - name: Salva le modifiche
        run: |
          # Conserva l'output generato prima di riallineare il checkout all'ultimo main.
          mkdir -p /tmp/generated-docs
          cp -a docs/. /tmp/generated-docs/
          if [ -f data/predictions.json ]; then cp data/predictions.json /tmp/predictions.json; fi

          git fetch origin main
          git reset --hard origin/main

          # Applica soltanto i JSON generati: index.html e gli asset statici
          # sono pubblicati da sync-static.yml e non vanno sovrascritti da un checkout vecchio.
          find /tmp/generated-docs -maxdepth 1 -type f -name '*.json' -exec cp -a {} docs/ \;
          git add docs
          if [ -f /tmp/predictions.json ]; then
            mkdir -p data
            cp /tmp/predictions.json data/predictions.json
            git add data/predictions.json
          fi
          if git diff --staged --quiet; then
            echo "Nessun dato generato da salvare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aggiorna pronostici"
          git push origin main
