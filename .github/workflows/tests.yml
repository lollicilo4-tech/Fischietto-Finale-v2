name: Test Fischietto Finale

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "docs/**"
      - "data/**"
      - "tests/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "docs/**"
      - "data/**"
      - "tests/**"
      - "generate.py"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-fischietto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa le dipendenze
        run: pip install -r requirements.txt
      - name: Esegui tutti i test
        run: python -m unittest discover -s tests -v
