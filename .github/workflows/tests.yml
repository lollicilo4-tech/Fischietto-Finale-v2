name: Test Fischietto Finale

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "docs/**"
      - "tests/**"
      - "generate.py"
      - "requirements.txt"
      - "worker/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "static/**"
      - "docs/**"
      - "tests/**"
      - "generate.py"
      - "requirements.txt"
      - "worker/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-fischietto-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa le dipendenze
        run: pip install -r requirements.txt
      - name: Esegui tutti i test
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Esegui i test del proxy Live
        run: npm test --prefix worker
