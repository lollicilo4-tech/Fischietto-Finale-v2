name: Pubblica interfaccia statica

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/sync-static.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica-interfaccia-statica
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Prepara gli asset e riallinea il checkout al main più recente
        run: |
          mkdir -p /tmp/fischietto-static
          cp -a static/. /tmp/fischietto-static/
          git fetch origin main
          git reset --hard origin/main
      - name: Sincronizza l'interfaccia pubblicata
        run: |
          mkdir -p docs
          cp -a /tmp/fischietto-static/. docs/
          python - <<'PY'
          from pathlib import Path
          path = Path("docs/index.html")
          html = path.read_text(encoding="utf-8")
          html = html.replace("/api/turno", "turno.json")
          html = html.replace("/api/storico", "storico.json")
          html = html.replace("/api/classifica", "classifica.json")
          path.write_text(html, encoding="utf-8")
          PY
      - name: Pubblica le modifiche senza rigenerare i pronostici
        run: |
          git add docs
          if git diff --staged --quiet; then
            echo "Interfaccia già aggiornata."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Pubblica interfaccia"
          # Se un altro workflow aggiorna main nel frattempo, integra il commit
          # e riprova invece di fallire con "fetch first".
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Impossibile pubblicare dopo 3 tentativi." >&2
          exit 1
